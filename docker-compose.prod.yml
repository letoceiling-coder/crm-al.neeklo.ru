services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-al-tokens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_al_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_al_gateway_prod_secret}
      POSTGRES_DB: crm_al_gateway
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - crm_al_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crm-al-tokens-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - crm_al_redis_data:/data

volumes:
  crm_al_postgres_data:
  crm_al_redis_data:
