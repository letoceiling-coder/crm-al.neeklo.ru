# crm-al.neeklo.ru — isolated vhost (does not modify other *.neeklo.ru sites)
# API: PM2 crm-al-tokens-api @ 127.0.0.1:3075
# Static: /var/www/crm-al-tokens/apps/web/dist
# SSL: certbot certonly --webroot -w /var/www/certbot -d crm-al.neeklo.ru --cert-name crm-al.neeklo.ru

server {
    listen 80;
    listen [::]:80;
    server_name crm-al.neeklo.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm-al.neeklo.ru;

    ssl_certificate     /etc/letsencrypt/live/crm-al.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm-al.neeklo.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crm-al.neeklo.ru.access.log;
    error_log  /var/log/nginx/crm-al.neeklo.ru.error.log;

    client_max_body_size 55m;
    root /var/www/crm-al-tokens/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3075/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
